name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:convex

      # Les garde-fous du plan de contrôle doivent tourner en CI, sinon la
      # politique de lecture seule et le classement de risque ne sont défendus
      # par rien : une surface non classée ou une écriture exposée passerait.
      - name: Test outillage (politique, couverture d'autorisation)
        run: pnpm test:tools

      - name: Matrice de parité à jour
        run: pnpm registry:check
